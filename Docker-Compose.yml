services:

  db:
    container_name: mariadb
    image: mariadb:lts
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--su-mysql", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin
    restart: always
    ports:
      - 8080:80
    environment:
      - PMA_ARBITRARY=1
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime_kuma
    restart: always
    ports:
      - "80:3001"
    depends_on:
      db:
        condition: service_healthy # Memaksa Kuma menunggu sampai MySQL berstatus 'healthy'